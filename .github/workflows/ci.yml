name: CI

# Runs on every PR, and is reused by deploy.yml (workflow_call) so that
# production is only ever deployed from a build that passed the same checks.
on:
  pull_request:
  workflow_call:

# A new push to the same PR cancels the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs only get what they ask for below.
permissions:
  contents: read

env:
  # Preview URLs look like https://pr-<n>-hello-type.<subdomain>.workers.dev
  WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN || 'amoghpadukone' }}

jobs:
  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  glyphs:
    name: Glyph data is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # glyph-data.json is generated; fail if someone hand-edited it or forgot to regenerate.
      - run: python3 scripts/build_glyphs.py
      - run: git diff --exit-code -- src/core/glyphs/glyph-data.json

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Canonical origin for og:image, canonical and sitemap URLs (see docs/deployment.md).
          SITE_URL: ${{ vars.SITE_URL }}
      # Deploy jobs ship this exact build instead of rebuilding it.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Preview URL for each PR. Skipped for forks (they have no access to secrets)
  # and when called from deploy.yml (event is then `push`, not `pull_request`).
  preview:
    name: Deploy preview
    needs: [quality, test, glyphs, build]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}-hello-type.${{ env.WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      # wrangler.jsonc (name, assets directory) is needed alongside dist.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message "PR ${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"
      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://pr-${{ github.event.pull_request.number }}-hello-type.${{ env.WORKERS_SUBDOMAIN }}.workers.dev
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none \
            --body "🚀 **Preview:** $URL  (commit \`${SHA::7}\`)"
