name: CI

# Reusable: called by preview.yml (PRs) and deploy.yml (main), so both only ship
# a build that passed the same checks. It needs only read access, which keeps
# it callable from workflows that grant nothing more.
on:
  workflow_call:

# Least privilege: jobs only get what they ask for below.
permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  glyphs:
    name: Glyph data is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # glyph-data.json is generated; fail if someone hand-edited it or forgot to regenerate.
      - run: python3 scripts/build_glyphs.py
      - run: git diff --exit-code -- src/core/glyphs/glyph-data.json

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Canonical origin for og:image, canonical and sitemap URLs (see docs/deployment.md).
          SITE_URL: ${{ vars.SITE_URL }}
      # Deploy jobs ship this exact build instead of rebuilding it.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
