name: Deploy

# Production deploy: every push to main runs the full CI, then ships that build
# to Cloudflare Workers (static assets). Can also be re-run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    # Add required reviewers or branch rules to this environment in repo
    # Settings → Environments if you want a manual approval gate.
    environment:
      name: production
      url: https://hello-type.${{ vars.WORKERS_SUBDOMAIN || 'amoghpadukone' }}.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
